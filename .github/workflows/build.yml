name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Unit tests and debug/release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile JVM tests, assemble and verify APKs, and run tests and lint
        run: |
          chmod +x gradlew
          # JVM test compilation must work before any APK exists.
          # The release APK is built explicitly: R8 missing-class failures only surface there.
          # The only native code is Compose graphics-path; the signed local release gate checks its alignment.
          ./gradlew :app:assembleDebugUnitTest :app:testDebugUnitTest :app:verifySharedClasspath \
            :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease \
            -Pautojs.gradle.build.number.auto.increment.enabled=false -Pautojs.gradle.build.time.update.enabled=false \
            --console=plain --stacktrace
          python3 .python/verify_apk_classpath.py app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload debug, release, and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: compose-ui-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and lint reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-contract:
    name: Plugin contract on the emulator (API ${{ matrix.api-level }}, ${{ matrix.arch }})
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            arch: x86
            target: google_apis
            profile: Nexus 5
          - api-level: 35
            arch: x86_64
            target: google_apis
            profile: pixel_7

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the activation and discovery contract tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          avd-name: Compose_UI_Conformance_CI_${{ matrix.api-level }}
          script: |
            chmod +x gradlew
            # Run activation/discovery plus renderer-local semantics and pixel tests. Cross-APK loading
            # and script-dispatch tests remain in the AutoJs6 host device matrix.
            ./gradlew :app:connectedDebugAndroidTest --console=plain --stacktrace

      - name: Upload instrumentation reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
