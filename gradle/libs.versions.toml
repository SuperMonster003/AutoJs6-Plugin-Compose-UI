[versions]

# Compose 1.12 line (compileSdk 37, AGP 9.1.1+); the plugin owns the Compose classes, the host owns AndroidX (roadmap D10 / D25).
compose-bom = "2026.09.00"
# Expose the already-resolved Material3 runtime bridge to renderer compilation; no runtime upgrade.
activity-compose = "1.8.2"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
jacoco = "0.8.14"
# F.5: the same HCT tone rule as the other standalone plugins (Material Color Utilities port, MIT).
material-color-utilities = "4.1.1"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"

[libraries]

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# F.4 / Q2 evaluation retains core + caller-owned image slots; no extended icon dependency is needed.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
junit = { module = "junit:junit", version.ref = "junit" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
